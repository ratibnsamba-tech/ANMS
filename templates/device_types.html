{% extends 'layout.html' %}
{% block title %}Device Types{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Device Types</h2>
  <a class="btn btn-primary" href="/device-types/new">Add Device Type</a>
</div>
<table class="table table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>Device Type</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for t in types %}
    <tr>
      <td>{{ t.id }}</td>
      <td>{{ t.device_type }}</td>
      <td>
        <a class="btn btn-sm btn-secondary" href="/device-types/{{ t.id }}/edit">Edit</a>
        <form method="post" action="/device-types/{{ t.id }}/delete" style="display:inline-block;">
          <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Delete this device type?');">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="3">No device types found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
