{% extends 'layout.html' %}
{% block title %}{{ 'Edit' if institution else 'New' }} Institution{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>{{ 'Edit' if institution else 'New' }} Institution</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" value="{{ institution.name if institution else '' }}" required>
      </div>
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="/institutions">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
