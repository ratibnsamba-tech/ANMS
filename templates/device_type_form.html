{% extends 'layout.html' %}
{% block title %}{{ 'Edit' if device_type else 'New' }} Device Type{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>{{ 'Edit' if device_type else 'New' }} Device Type</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Device Type</label>
        <input class="form-control" name="device_type" value="{{ device_type.device_type if device_type else '' }}" required>
      </div>
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="/device-types">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
